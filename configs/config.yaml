# ChurnAI pipeline configuration.
# All paths are relative to the project root (CHURNAI_HOME, defaulting to the
# current working directory) so the project runs from any clean clone.

project:
  name: churnai
  random_seed: 42

paths:
  raw_data: data/raw/Customer-Churn-Records.csv
  processed_dir: data/processed
  rejected_dir: data/rejected
  reports_dir: reports
  model_dir: models

data:
  # Fractions of the full dataset; splits are stratified on the target.
  test_size: 0.20
  # Columns removed before modelling, with the reason recorded in code review.
  identifier_columns: [RowNumber, CustomerId, Surname]
  leakage_columns: [Complain]
  # Abort preparation if more than this fraction of rows fails validation;
  # a large rejection rate means an upstream break, not a few bad records.
  max_rejected_fraction: 0.05

training:
  models_config: configs/models.yaml
  tuning_config: configs/tuning.yaml
  cv_folds: 5
  primary_metric: roc_auc
  # Any held-out ROC-AUC above this is treated as a target-leakage red flag.
  leakage_auc_threshold: 0.95
  # The decision threshold is tuned on out-of-fold predictions to maximise this.
  threshold_metric: f1

mlflow:
  tracking_uri: sqlite:///mlflow.db
  artifact_dir: mlartifacts
  # Runtime dependencies recorded with each logged model.
  pip_requirements: requirements/serve.txt
  experiment_name: churnai
  tuning_experiment: churnai-tuning
  ab_experiment: churnai-ab
  registered_model_name: churnai-classifier
  champion_alias: champion
  challenger_alias: challenger

explain:
  top_k: 5
  background_size: 200
  # Training rows behind the SHAP plots logged to each MLflow run.
  report_sample_size: 2000

monitoring:
  psi_bins: 10
  psi_alert_threshold: 0.2
  drift_window_size: 500
  drift_min_samples: 100
  latency_window_size: 1000

ab_test:
  # Off by default: the API serves the champion alone until this is switched on.
  enabled: false
  # Share of customers (0-100) routed to the challenger: hash(customer) % 100 < split_pct.
  split_pct: 50
  bundle_dir: models/ab
  predictions_log: logs/ab_predictions.jsonl
  feedback_log: logs/ab_feedback.jsonl
  # Offline comparison: repeated stratified CV (repeats x training.cv_folds folds).
  cv_repeats: 5
  bootstrap_iterations: 2000
  alpha: 0.05
  # Online decision rule, fixed before any traffic is replayed.
  power: 0.80
  min_detectable_recall_diff: 0.05
  # Illustrative business costs: replace with the bank's real figures.
  cost_false_negative: 500  # a churner the model missed
  cost_false_positive: 50   # a retention offer to a customer who would have stayed
