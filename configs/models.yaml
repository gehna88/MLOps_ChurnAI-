# Candidate model configurations compared by `make train`.
# `estimator` selects a builder from churnai.models.factory; `params` are passed
# through to the estimator. The special value `auto` for scale_pos_weight is
# replaced with (negatives / positives) computed on the training split.

candidates:
  - name: logreg_baseline
    estimator: logistic_regression
    params:
      C: 1.0
      max_iter: 2000
      class_weight: balanced

  - name: xgb_shallow
    estimator: xgboost
    params:
      n_estimators: 400
      max_depth: 3
      learning_rate: 0.05
      subsample: 0.9
      colsample_bytree: 0.8
      scale_pos_weight: auto

  - name: xgb_deep
    estimator: xgboost
    params:
      n_estimators: 300
      max_depth: 6
      learning_rate: 0.03
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_weight: 3
      scale_pos_weight: auto

  - name: lgbm_default
    estimator: lightgbm
    params:
      n_estimators: 400
      num_leaves: 31
      learning_rate: 0.03
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.8
      class_weight: balanced

  # Generated by `make tune`: everything below this line is overwritten.
  - name: xgb_tuned
    estimator: xgboost
    params:
      scale_pos_weight: auto
      n_estimators: 299
      max_depth: 4
      learning_rate: 0.024003
      subsample: 0.75398
      colsample_bytree: 0.65504
      min_child_weight: 6
  - name: lgbm_tuned
    estimator: lightgbm
    params:
      class_weight: balanced
      subsample_freq: 1
      n_estimators: 647
      num_leaves: 12
      learning_rate: 0.010355
      subsample: 0.872595
      colsample_bytree: 0.87054
      min_child_samples: 38
  - name: logreg_tuned
    estimator: logistic_regression
    params:
      class_weight: balanced
      max_iter: 2000
      solver: liblinear
      C: 0.008261
      penalty: l2
