# Roll back (or forward) the Render service to any image already in GHCR.
#
# Actions > Rollback > Run workflow, then enter a tag such as sha-1a2b3c4 or v1.0.0.
# The image is verified to exist before Render is asked to deploy it, and the workflow
# waits until /health reports that exact build. No rebuild, no retraining: the same
# bytes that passed CI earlier are redeployed.
name: Rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (e.g. sha-1a2b3c4). See the GHCR package page for tags."
        required: true
        type: string

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/churnai

jobs:
  rollback:
    name: Deploy ${{ inputs.tag }} to Render
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the image tag exists
        run: docker manifest inspect "$IMAGE:${{ inputs.tag }}" > /dev/null

      - name: Deploy the image and wait until it is live
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set"
            exit 1
          fi
          python scripts/render_deploy.py --image "$IMAGE:${{ inputs.tag }}" --wait
          echo "Rolled back to $IMAGE:${{ inputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
