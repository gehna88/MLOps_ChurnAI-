# Roll back (or forward) the Azure Web App to any image already in GHCR.
#
# Actions > Rollback > Run workflow, then enter a tag such as sha-1a2b3c4.
# The image is verified to exist before Azure is asked to run it, and the workflow
# waits until /health reports that exact build. No rebuild, no retraining: the same
# bytes that passed CI earlier are redeployed.
#
# Use sha-... tags: /health reports the sha-... build, so release tags (v*) can't be verified.
name: Rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (e.g. sha-1a2b3c4). See the GHCR package page for tags."
        required: true
        type: string

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/churnai
  TAG: ${{ inputs.tag }}

jobs:
  rollback:
    name: Deploy ${{ inputs.tag }} to Azure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the Azure settings are configured
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          SERVICE_URL: ${{ vars.SERVICE_URL }}
        run: |
          [ -n "$PUBLISH_PROFILE" ] || { echo "::error::AZURE_WEBAPP_PUBLISH_PROFILE secret is not set"; exit 1; }
          [ -n "$APP_NAME" ] || { echo "::error::AZURE_WEBAPP_NAME variable is not set"; exit 1; }
          [ -n "$SERVICE_URL" ] || { echo "::error::SERVICE_URL variable is not set"; exit 1; }

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the image tag exists
        run: docker manifest inspect "$IMAGE:$TAG" > /dev/null

      - name: Deploy the image to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.IMAGE }}:${{ inputs.tag }}

      - name: Wait until it is live
        env:
          SERVICE_URL: ${{ vars.SERVICE_URL }}
        run: |
          python scripts/wait_for_build.py --url "$SERVICE_URL" --build "$TAG"
          echo "Rolled back to $IMAGE:$TAG on Azure" >> "$GITHUB_STEP_SUMMARY"
