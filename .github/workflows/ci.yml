# Continuous integration: proves on every push that the project works from a clean
# clone on Python 3.11 (lint, tests, full pipeline and a live API smoke test).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the run already in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, test, train and serve (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install pinned dependencies
        run: make setup

      - name: Lint (ruff)
        run: make lint

      - name: Run the test suite (pytest)
        run: make test

      - name: Profile the data and scan for leakage
        run: make profile

      - name: Prepare data (validate and split)
        run: make data

      - name: Train candidates and register the champion (MLflow)
        run: make train

      - name: Smoke-test the API with the trained model
        run: |
          python -m uvicorn churnai.api.app:create_app --factory --port 8000 &
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
          python scripts/healthcheck.py
          curl -sf -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"credit_score": 619, "geography": "France", "gender": "Female", "age": 42,
                 "tenure": 2, "balance": 0, "num_of_products": 1, "has_cr_card": 1,
                 "is_active_member": 1, "estimated_salary": 101348.88,
                 "satisfaction_score": 2, "card_type": "DIAMOND", "point_earned": 464}' \
            | python -c "import json, sys; r = json.load(sys.stdin); assert 0 <= r['churn_probability'] <= 1; print(r)"

      - name: Upload training reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-reports
          path: |
            reports/
            models/metadata.json
          if-no-files-found: ignore
