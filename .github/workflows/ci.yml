# Continuous integration and delivery.
#
#   lint ─┐
#         ├─> build: train the model, build the Docker image, smoke-test the container
#   test ─┘          └─ on push to main: push the image to GHCR and deploy it to Render
#
# Every image is tagged with the commit (sha-1a2b3c4) and `latest`; release tags (v*)
# also get their own image tag. Any earlier tag can be redeployed with the Rollback workflow.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the run already in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  IMAGE: ghcr.io/${{ github.repository_owner }}/churnai

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Only ruff is needed, at the version pinned in requirements/dev.txt.
      - name: Install ruff
        run: pip install "$(grep '^ruff==' requirements/dev.txt)"
      - name: Lint
        run: make lint

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install pinned dependencies
        run: make setup
      - name: Run the test suite
        run: python -m pytest --junitxml=reports/junit.xml
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/junit.xml
          if-no-files-found: ignore

  build:
    name: Build, smoke-test and publish the Docker image
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write  # push to ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install pinned dependencies
        run: make setup

      # The image ships the trained model, so the pipeline runs from a clean clone first.
      - name: Profile, prepare data and train the champion
        run: |
          make profile
          make data
          make train

      - name: Compute image tags
        id: tags
        run: |
          echo "build=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build the Docker image
        run: |
          docker build \
            --build-arg BUILD=${{ steps.tags.outputs.build }} \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t churnai:ci .
          docker image ls churnai:ci

      - name: Smoke-test the running container
        run: |
          docker run -d --name churnai -p 8000:8000 churnai:ci
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
          echo
          curl -sf http://127.0.0.1:8000/health \
            | python -c "import json, sys; h = json.load(sys.stdin); assert h['model_loaded'] and h['build'] == '${{ steps.tags.outputs.build }}', h; print(h)"
          curl -sf -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"credit_score": 619, "geography": "France", "gender": "Female", "age": 42,
                 "tenure": 2, "balance": 0, "num_of_products": 1, "has_cr_card": 1,
                 "is_active_member": 1, "estimated_salary": 101348.88,
                 "satisfaction_score": 2, "card_type": "DIAMOND", "point_earned": 464}' \
            | python -c "import json, sys; r = json.load(sys.stdin); assert 0 <= r['churn_probability'] <= 1; print(r)"
          curl -sf http://127.0.0.1:8000/metrics | python -m json.tool | head -n 20

      - name: Wait for the Docker HEALTHCHECK to pass
        run: |
          for attempt in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' churnai)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 5
          done
          docker logs churnai | tail -n 50
          exit 1

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image to GHCR
        if: github.event_name == 'push'
        run: |
          docker tag churnai:ci "$IMAGE:${{ steps.tags.outputs.build }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag churnai:ci "$IMAGE:latest"
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            docker tag churnai:ci "$IMAGE:${{ github.ref_name }}"
          fi
          docker push --all-tags "$IMAGE"
          echo "Pushed $IMAGE:${{ steps.tags.outputs.build }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: python scripts/render_deploy.py --image "$IMAGE:${{ steps.tags.outputs.build }}" --wait

      - name: Upload training reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-reports
          path: |
            reports/
            models/metadata.json
          if-no-files-found: ignore
